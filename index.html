<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criando Menu Resposivo</title>
    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <body>
    <header>
      <div class="box">
        <div class="logo">
          <a href="#"><img src="./img/Tech Blog.png" alt="Logo Tech Blog" /></a>
          <div class="menuIcon">
            <img src="./img/open.svg" alt="Icone de abrir o menu" />
          </div>
        </div>
        <nav>
          <div class="options">
            <ul>
              <li>
                <a href="#" class="optionAll">All</a>
              </li>
              <li>
                <a href="#">CSS</a>
              </li>
              <li>
                <a href="#">Javascript</a>
              </li>
              <li>
                <a href="#">Python</a>
              </li>
              <li>
                <a href="#">Java</a>
              </li>
            </ul>
          </div>
          <div class="settings">
            <div class="search">
              <label for="search">
                <img src="./img/search.png" alt="lupa" class="serchIcon" />
              </label>
              <input type="text" placeholder="Procurar" id="search" />
            </div>
            <div class="userPhoto">
              <a href="#">
                <img src="./img/profile.png" alt="Foto do usuário" />
              </a>
              <span class="userName">Samuel Leão</span>
            </div>
          </div>
        </nav>
      </div>
    </header>
  </body>
</html>
